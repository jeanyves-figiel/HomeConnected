# Apple Home has no speaker category for non-AirPlay controls.
# Workaround: volume = dimmable light, favorites = scripts (shown as switches).
# AirPlay 2 pairing in Home stays for playback + Siri.
# One Sonos in the home: Bathroom (Sonos One, media_player.bathroom_bathroom). No grouping.
template:
  - light:
      - name: Bathroom Volume
        unique_id: sonos_bathroom_volume
        state: "{{ is_state('media_player.bathroom_bathroom', 'playing') }}"
        level: "{{ ((state_attr('media_player.bathroom_bathroom', 'volume_level') or 0) * 255) | int }}"
        turn_on:
          - action: media_player.media_play
            target:
              entity_id: media_player.bathroom_bathroom
        turn_off:
          - action: media_player.media_pause
            target:
              entity_id: media_player.bathroom_bathroom
        set_level:
          - action: media_player.volume_set
            target:
              entity_id: media_player.bathroom_bathroom
            data:
              volume_level: "{{ brightness / 255 }}"

# Favorites: `source` must match an item of sensor.sonos_favorites (0 favorites on 2026-10-22).
# Add favorites in the Sonos app, set `source`, then add the scripts to homekit_bridge.yaml.
script:
  sonos_favorite_1:
    alias: Sonos Favorite 1
    sequence:
      - action: media_player.select_source
        target:
          entity_id: media_player.bathroom_bathroom
        data:
          source: "FIP"
  sonos_favorite_2:
    alias: Sonos Favorite 2
    sequence:
      - action: media_player.select_source
        target:
          entity_id: media_player.bathroom_bathroom
        data:
          source: "France Inter"
