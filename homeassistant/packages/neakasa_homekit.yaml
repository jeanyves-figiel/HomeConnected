# Neakasa M1 via HACS integration (roquerodrigo/ha-neakasa-litterbox, cloud MQTT push).
# Apple Home has no litter-box category: map to sensors + switch.
# Source entity IDs below are placeholders: check integration's actual entities.
template:
  - binary_sensor:
      - name: Litter Bin Full
        unique_id: litter_bin_full
        device_class: problem
        state: "{{ is_state('sensor.neakasa_bin_state', 'full') }}"
      - name: Litter Cat Present
        unique_id: litter_cat_present
        device_class: occupancy
        state: "{{ is_state('sensor.neakasa_status', 'cat_present') }}"
  - sensor:
      - name: Litter Visits Today
        unique_id: litter_visits_today
        state_class: measurement
        state: "{{ states('sensor.neakasa_visits_today') }}"
  - switch:
      - name: Litter Clean Now
        unique_id: litter_clean_now
        state: "{{ is_state('sensor.neakasa_status', 'cleaning') }}"
        turn_on:
          - action: button.press
            target:
              entity_id: button.neakasa_clean_now
        turn_off: []
