# One bridge for every device without native HomeKit/Matter.
# Hue, HomePod, Dreame (Matter), Sony BRAVIA TV (AirPlay/HomeKit) are paired directly in Apple Home: never include them here.
homekit:
  - name: HA Bridge
    port: 21064
    filter:
      include_entities:
        # Xiaomi purifier (xiaomi_home / xiaomi_miot)
        - fan.air_purifier  # wrapped (xiaomi_purifier_homekit.yaml)
        - sensor.xiaomi_air_purifier_pm25
        - sensor.xiaomi_air_purifier_filter_life
        # Dreame room/mode scripts (B5, dreame_vacuum); vacuum itself is native Matter
        - script.dreame_clean_living
        - script.dreame_clean_kitchen
        - script.dreame_clean_bedroom
        - script.dreame_mode_vacuum_only
        - script.dreame_mode_vacuum_and_mop
        - script.dreame_suction_max
        - script.dreame_suction_quiet
        # Sonos extensions (sonos_homekit.yaml)
        - light.bathroom_volume
        # - script.sonos_favorite_1  # enable once Sonos favorites exist
        # - script.sonos_favorite_2
        # Neakasa (neakasa_homekit.yaml)
        - binary_sensor.litter_bin_full
        - binary_sensor.litter_cat_present
        - sensor.litter_visits_today
        - switch.litter_clean_now
        # Petlibro feeder (petlibro_homekit.yaml)
        - switch.feeder_feed_now
        - binary_sensor.feeder_food_low
        - binary_sensor.feeder_dispenser_blocked
    entity_config:
      fan.air_purifier:
        linked_pm25_sensor: sensor.xiaomi_air_purifier_pm25
        linked_filter_change_indicator_binary_sensor: binary_sensor.xiaomi_air_purifier_filter_low
      binary_sensor.litter_bin_full:
        name: Litter bin full

# Petcube camera: separate accessory-mode instance once custom integration exists (see issue tracker).
