# Xiaomi Smart Air Purifier 4 Compact (xiaomi.airp.cpa4) via HACS xiaomi_miot.
# Speed = favorite level (number.xiaomi_cpa4_5e82_favorite_level, 0-14, verified on unit 2026-10-22).
# Template fan wraps it with percentage + presets. Bridge exposes fan.air_purifier (not raw entity).
template:
  - fan:
      - name: Air Purifier
        unique_id: air_purifier_wrapped
        state: "{{ states('fan.xiaomi_cpa4_5e82_air_purifier') }}"
        percentage: >-
          {% set fav = states('number.xiaomi_cpa4_5e82_favorite_level') | int(0) %}
          {{ (fav / 14 * 100) | round(0) | int }}
        preset_mode: "{{ state_attr('fan.xiaomi_cpa4_5e82_air_purifier', 'preset_mode') }}"
        preset_modes:
          - Auto
          - Sleep
          - Favorite
        turn_on:
          - action: fan.turn_on
            target:
              entity_id: fan.xiaomi_cpa4_5e82_air_purifier
        turn_off:
          - action: fan.turn_off
            target:
              entity_id: fan.xiaomi_cpa4_5e82_air_purifier
        set_preset_mode:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.xiaomi_cpa4_5e82_air_purifier
            data:
              preset_mode: "{{ preset_mode }}"
        set_percentage:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.xiaomi_cpa4_5e82_air_purifier
            data:
              preset_mode: Favorite
          - action: number.set_value
            target:
              entity_id: number.xiaomi_cpa4_5e82_favorite_level
            data:
              value: "{{ (percentage / 100 * 14) | round(0) | int }}"
  - binary_sensor:
      - name: Air Purifier Filter Low
        unique_id: air_purifier_filter_low
        device_class: problem
        state: "{{ states('sensor.xiaomi_cpa4_5e82_filter_life_level') | int(100) < 10 }}"
